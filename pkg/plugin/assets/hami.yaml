# HAMi v2.10.0, rendered from the upstream Helm chart (orcinus plugins apply
# plain manifests, not charts). Regenerate after bumping the version:
#
#   curl -fsSLO https://github.com/Project-HAMi/HAMi/releases/download/v2.10.0/hami-2.10.0.tgz
#   helm template hami hami-2.10.0.tgz -n kube-system --kube-version v1.31.5 \
#     --set scheduler.kubeScheduler.image.registry=registry.k8s.io \
#     --set scheduler.kubeScheduler.image.repository=kube-scheduler \
#     --set devicePlugin.runtimeClassName=nvidia > pkg/plugin/assets/hami.yaml
#
# --kube-version pins the bundled kube-scheduler to cluster.DefaultImage's k3s.
# runtimeClassName=nvidia is the RuntimeClass k3s creates when it finds the
# NVIDIA container runtime; HAMi's webhook adds it to every GPU pod.
