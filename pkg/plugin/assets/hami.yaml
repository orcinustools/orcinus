      annotations:
        checksum/hami-scheduler-config: 25f59f38328307178da3b9304fdf140ede687e949004525067117a272a920da2
        checksum/hami-scheduler-device-config: f0bee2e0e1b557aea9f321a300ba1f288944edbf533bcbef476d45f34e1cf172
    spec:
      serviceAccountName: hami-scheduler
      priorityClassName: system-node-critical
      
      containers:
        - name: kube-scheduler
          image: registry.k8s.io/kube-scheduler:v1.31.5
          imagePullPolicy: IfNotPresent
          command:
            - kube-scheduler
            - --config=/config/config.yaml
            - -v=4
          resources:
            {}
          volumeMounts:
            - name: scheduler-config
              mountPath: /config
        - name: vgpu-scheduler-extender
          image: docker.io/projecthami/hami:v2.10.0
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HAMI_NODELOCK_EXPIRE
              value: "5m"
          command:
            - scheduler
            - --http_bind=0.0.0.0:443
            - --cert_file=/tls/tls.crt
            - --key_file=/tls/tls.key
            - --scheduler-name=hami-scheduler
            - --metrics-bind-address=:9395
            - --node-scheduler-policy=binpack
            - --gpu-scheduler-policy=spread
            - --force-overwrite-default-scheduler=true
            - --device-config-file=/device-config.yaml
            - --leader-elect=true
            - --leader-elect-resource-name=hami-scheduler
            - --leader-elect-resource-namespace=kube-system
            - --debug
            - -v=4
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
            - name: metrics
              containerPort: 9395
              protocol: TCP
          resources:
            {}
          volumeMounts:
            - name: device-config
              mountPath: /device-config.yaml
              subPath: device-config.yaml
            - name: tls-config
              mountPath: /tls
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - hami-scheduler
              topologyKey: "kubernetes.io/hostname"
      volumes:
        - name: tls-config
          secret:
            secretName: hami-scheduler-tls
        - name: scheduler-config
          configMap:
            name: hami-scheduler
        - name: device-config
          configMap:
            name: hami-scheduler-device
