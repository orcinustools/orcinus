# A VM with a **persistent disk**, imported by CDI — and a container talking to it.
#
# Unlike the containerDisk VMs in `orcinus.yml` / `distros.yml` (throwaway overlay,
# writes lost on restart), this one imports the cloud image into a PVC once and
# keeps it: reboot the VM and your packages, users and data are still there.
#
# Prerequisite — the plugin with the Containerized Data Importer:
#
#   orcinus plugin install kubevirt --cdi [--emulation]
#   orcinus kubectl -n cdi get cdi cdi -o jsonpath='{.status.phase}'   # Deployed
#
# Then:
#
#   orcinus deploy -f cdi-datavolume.yml
#   orcinus kubectl get dv,pvc                 # the import (~600 MiB) → Succeeded
#   orcinus kubectl get vmi -w                 # VM starts once the disk is ready
#
# cloud-init installs nginx on first boot, so once the VM is up any container can
# reach it through a normal Service:
#
#   orcinus kubectl run curl --rm -it --image=curlimages/curl --restart=Never -- curl -s http://vm-web
#   → hello from an Ubuntu VM on orcinus
#
# Give it a few minutes: disk import, then boot, then `apt install nginx` inside
# the guest (slower still under --emulation). Add an Ingress pointing at the
# `vm-web` Service to publish it — see ../ingress-tls/orcinus.yml.
#
# Swap `source.registry.url` for any image in `distros.yml`, or use an upstream
# qcow2 directly:
#
#   source:
#     http:
#       url: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img

apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-web
spec:
  runStrategy: Always
  # CDI creates this DataVolume (+ its PVC) and imports the image into it. The VM
  # waits for the import to finish before booting.
  dataVolumeTemplates:
    - metadata:
        name: vm-web-root
      spec:
        source:
          registry:
            url: docker://quay.io/containerdisks/ubuntu:24.04
        storage:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi        # the disk grows to this on first boot
  template:
    metadata:
      labels:
        app: vm-web
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1Gi
        devices:
          rng: {}
          disks:
            - name: rootdisk
              disk: { bus: virtio }
            - name: cloudinit
              disk: { bus: virtio }
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: vm-web-root      # the imported PVC, not a throwaway overlay
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: vm-web
              users:
                - name: orcinus
                  groups: [sudo, wheel]
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
                  lock_passwd: false
                  plain_text_passwd: orcinus
              ssh_pwauth: true
              write_files:
                - path: /var/www/html/index.html
                  content: hello from an Ubuntu VM on orcinus
              packages:
                - nginx
              runcmd:
                - [ systemctl, enable, --now, nginx ]

---
# The VM serves HTTP on 80 like any other backend — containers reach it at
# http://vm-web, and an Ingress can publish it.
apiVersion: v1
kind: Service
metadata:
  name: vm-web
spec:
  selector:
    app: vm-web
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: ssh
      port: 22
      targetPort: 22
